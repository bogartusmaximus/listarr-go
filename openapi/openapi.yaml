openapi: 3.0.3
info:
  title: listarr-go
  description: |
    Public listarr-go API. Inspired by fisherd80/Listarr (MIT).
    Safe defaults: loopback listen, apply opt-in, no private host defaults.
  version: 0.2.0
servers:
  - url: http://127.0.0.1:8787
    description: Local loopback (default)
paths:
  /health:
    get:
      operationId: health
      summary: Liveness probe (no auth)
      responses:
        "200":
          description: OK
  /api/v1/system/status:
    get:
      operationId: systemStatus
      security:
        - ApiKeyHeader: []
      responses:
        "200":
          description: Status
        "401":
          description: Unauthorized
  /api/v1/discover/movies:
    get:
      operationId: discoverMovies
      security:
        - ApiKeyHeader: []
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: sort_by
          in: query
          schema: { type: string }
        - name: year
          in: query
          schema: { type: integer }
        - name: vote_average.gte
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Discover results
        "503":
          description: TMDB not configured
  /api/v1/discover/tv:
    get:
      operationId: discoverTV
      security:
        - ApiKeyHeader: []
      responses:
        "200":
          description: Discover results
        "503":
          description: TMDB not configured
  /api/v1/sync/preview:
    post:
      operationId: syncPreview
      security:
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Preview result
        "400":
          description: Invalid request
  /api/v1/sync/apply:
    post:
      operationId: syncApply
      security:
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Apply result
        "403":
          description: Apply disabled
components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    SyncRequest:
      type: object
      required: [source, mediaType, target]
      properties:
        source:
          type: string
          enum: [tmdb]
        mediaType:
          type: string
          enum: [movie, tv]
        tmdbIds:
          type: array
          items: { type: integer }
        discover:
          type: object
          properties:
            page: { type: integer }
            sortBy: { type: string }
            year: { type: integer }
            voteAverageGte: { type: number }
            voteCountGte: { type: integer }
        maxItems:
          type: integer
          maximum: 50
        target:
          $ref: "#/components/schemas/Target"
    Target:
      type: object
      required: [rootFolderPath, qualityProfileId]
      properties:
        rootFolderPath:
          type: string
          example: /data/movies
        qualityProfileId:
          type: integer
          minimum: 1
        tags:
          type: array
          items: { type: integer }
        monitored:
          type: boolean
        searchOnAdd:
          type: boolean
        seasonFolder:
          type: boolean
