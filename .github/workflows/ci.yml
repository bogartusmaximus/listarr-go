name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test
        run: go test ./...
      - name: Polars CSV smoke
        run: |
          dir=$(mktemp -d)
          cat > "$dir/sync_runs.csv" <<'EOF'
          id,dry_run,source,media_type,source_instance,target_instance,adds,skips,deferred_search,errors,created_at
          run-1,true,arr-library,movie,local,remote,2,1,0,0,2026-08-11T12:00:00Z
          EOF
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv run --with polars python3 scripts/test_polars_store.py "$dir/sync_runs.csv"
      - name: Contract smoke
        run: |
          export LISTARR_LISTEN='127.0.0.1:18787'
          export LISTARR_STORE_BACKEND=polars
          export LISTARR_POLARS_DIR=$(mktemp -d)
          go run ./cmd/listarr-go &
          pid=$!
          trap 'kill $pid' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18787/health" >/dev/null; then
              break
            fi
            sleep 0.2
          done
          KEY=$(python3 -c "import json; print(json.load(open('$LISTARR_POLARS_DIR/settings.json'))['apiKey'])")
          python3 scripts/run-contract-tests.py \
            --base-url http://127.0.0.1:18787 \
            --api-key "$KEY"
