# Self-hosted deploy on the ci-development runner VM.
# Deploy path: push → thin GHA job → Semaphore → Ansible on autobot-development.
# See autobot-homelab/docs/ci/GITHUB-CI-SEMAPHORE-DEPLOY.md
# Register runner: autobot-homelab/scripts/ci/register-autobot-repo-runners.sh listarr-go --lane development
#
# Quality on PRs to ci-development; deploy only on push to ci-development.
# Do not cancel in-progress deploys (mid-compose tear-down).

name: ci-development

on:
  push:
    branches:
      - ci-development
  pull_request:
    branches:
      - ci-development
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-ci-development:
    name: Tests (ci-development)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, Linux, X64, autobot, ci-development]
    steps:
      - name: Sanitize workspace before checkout
        run: |
          set -euo pipefail
          work="${GITHUB_WORKSPACE:-}"
          if [[ -z "$work" ]]; then
            echo "GITHUB_WORKSPACE unset; skipping sanitize"
            exit 0
          fi
          if [[ ! -d "$work" ]]; then
            mkdir -p "$work"
            echo "created empty workspace $work"
            exit 0
          fi
          if sudo -n find "$work" -user root -print -quit 2>/dev/null | grep -q .; then
            echo "Reclaiming root-owned paths under $work"
            sudo -n chown -R "$(id -u):$(id -g)" "$work"
          else
            echo "No root-owned paths under $work"
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          # Self-hosted runners keep ~/go/pkg/mod between jobs; restoring the
          # GHA module cache over those read-only files makes tar exit 2.
          cache: false
      - name: Test
        run: go test ./...

  deploy-ci-development:
    name: Trigger Semaphore deploy (ci-development)
    needs: quality-ci-development
    if: >
      github.ref == 'refs/heads/ci-development' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, autobot, ci-development]
    concurrency:
      group: deploy-listarr-go-development
      cancel-in-progress: false
    steps:
      - name: Trigger homelab Semaphore deploy
        env:
          CI_DEPLOY_TRIGGER_TOKEN: ${{ secrets.CI_DEPLOY_TRIGGER_TOKEN }}
          CI_DEPLOY_RELAY_URL: https://automation.tailnet-a308.ts.net:8444/hooks/ci-deploy
        run: |
          set -euo pipefail
          if [[ -z "${CI_DEPLOY_TRIGGER_TOKEN:-}" ]]; then
            echo "CI_DEPLOY_TRIGGER_TOKEN is not set on this repository." >&2
            echo "Add the secret (same value as automation-gw vault_ci_deploy_trigger_token)." >&2
            exit 1
          fi
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "sha": os.environ["GITHUB_SHA"],
          }))
          PY
          )"
          http_code="$(curl -sS -o /tmp/ci-deploy-trigger.out -w '%{http_code}' \
            -X POST "${CI_DEPLOY_RELAY_URL}" \
            -H "Authorization: Bearer ${CI_DEPLOY_TRIGGER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload")"
          cat /tmp/ci-deploy-trigger.out
          echo ""
          if [[ "$http_code" != "202" && "$http_code" != "200" ]]; then
            echo "Semaphore relay returned HTTP ${http_code}" >&2
            exit 1
          fi
          echo "Queued Semaphore deploy for ${GITHUB_REPOSITORY}@${GITHUB_REF#refs/heads/}"
